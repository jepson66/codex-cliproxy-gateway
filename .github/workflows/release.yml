name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Verify release archive contents
        run: |
          set -eu
          tar -tzf dist/codex-cliproxy-gateway_linux_amd64.tar.gz
          unzip -l dist/codex-cliproxy-gateway_windows_amd64.zip
          sha256sum --check dist/checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
